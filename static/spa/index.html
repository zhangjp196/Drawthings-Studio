  <script>
    // 首屏前应用主题（防闪）：浅色 / 深色 / 跟随系统
    (function () {
      var t = "system";
      try { t = localStorage.getItem("theme") || "system"; } catch (e) {}
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.classList.toggle("dark", dark);
      try {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#0e1014" : "#f7f7f5");
        if (localStorage.getItem("lang") === "en") document.documentElement.setAttribute("lang", "en");
      } catch (e) {}
    })();
  </script>

  <style>
    /* 首屏骨架：JS 尚未就绪时先给一个品牌化画面，避免白屏/闪烁（app.js 挂载后移除） */
    #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#f7f7f5;color:#111318;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    html.dark #boot{background:#0e1014;color:#f4f5f7}
    .boot-mark{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#ff5a3c;color:#fff;font-size:27px;box-shadow:0 14px 40px rgba(255,90,60,.30)}
    .boot-name{font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;font-weight:700}
    .boot-line{width:168px;height:3px;border-radius:3px;background:rgba(17,19,24,.09);overflow:hidden}
    html.dark .boot-line{background:rgba(255,255,255,.12)}
    .boot-line i{display:block;height:100%;width:38%;border-radius:3px;background:#ff5a3c;animation:bootslide 1.1s ease-in-out infinite}
    @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
    @media (prefers-reduced-motion:reduce){.boot-line i{animation:none;width:100%;opacity:.35}}
  </style>
</head>
